# m.51pwn.com —— mplay 在线版（Nginx 反代 + 媒体流直通）
server {
    listen 80;
    listen [::]:80;
    server_name m.51pwn.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m.51pwn.com;

    ssl_certificate     /etc/letsencrypt/live/m.51pwn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.51pwn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 歌词导入是原始文本上传，给 16MB 足够
    client_max_body_size 16m;

    # 音频/视频拖动依赖 Range，不要缓冲整段
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8737;
    }

    # 媒体流单独放宽超时，避免大文件播放中断
    location ~ ^/(media|cover)/ {
        proxy_pass http://127.0.0.1:8737;
        proxy_read_timeout 7200s;
        add_header Cache-Control "private, max-age=600";
    }

    access_log /var/log/nginx/mplay.access.log;
    error_log  /var/log/nginx/mplay.error.log warn;
}
